name: Windows EXE bauen

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Dateien herunterladen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: EXE erstellen
        run: |
          pyinstaller --onefile --windowed --name "PDF-Rechnungs-Umbenenner" pdf_rechnungs_renamer.py

      - name: EXE als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: PDF-Rechnungs-Umbenenner-Windows-EXE
          path: dist/PDF-Rechnungs-Umbenenner.exe